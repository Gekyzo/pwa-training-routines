<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="theme-color" content="#e8590c" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0f0f0e" media="(prefers-color-scheme: dark)">
    <title>Training Routines</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./icons/icon-192.png" type="image/png">
    <link rel="apple-touch-icon" href="./icons/icon-192.png">
    <link rel="stylesheet" href="./vendor/design-system/design-system.css">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <header class="app-header">
      <div class="app-header-text">
        <h1 id="title" class="app-header-title"></h1>
        <p id="subtitle" class="app-header-subtitle"></p>
      </div>
    </header>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden>
      <span id="toast-text" class="toast-text"></span>
      <button id="toast-action" class="button strong" type="button" hidden></button>
    </div>

    <main>
      <section id="workout" class="workout">
        <div id="workout-start">
          <h2 id="workout-routines-head" class="list-group-head" data-i18n="workout.next"></h2>
          <div id="workout-routines" class="list-group"></div>
          <div class="cluster">
            <button id="workout-empty" class="button tonal" type="button" data-i18n="workout.empty"></button>
          </div>
          <h2 id="workout-history-head" class="list-group-head" data-i18n="workout.history"></h2>
          <ul id="workout-history" class="item-list"></ul>
          <p id="workout-history-empty" class="empty-state inline" data-i18n="workout.noHistory"></p>
        </div>
        <div id="workout-open" hidden>
          <div id="rest-timer" class="rest-timer" role="timer" hidden>
            <svg class="icon" aria-hidden="true"><use href="icons.svg#timer"/></svg>
            <span id="rest-timer-time" class="rest-timer-time"></span>
            <div class="rest-timer-actions">
              <button id="rest-less" class="button tonal" type="button" data-i18n="timer.less"></button>
              <button id="rest-more" class="button tonal" type="button" data-i18n="timer.more"></button>
              <button id="rest-skip" class="button accent" type="button" data-i18n="timer.skip"></button>
            </div>
          </div>
          <div class="workout-head">
            <button id="workout-back" class="button quiet" type="button" data-i18n="common.back"></button>
            <h2 id="workout-title" class="workout-title"></h2>
            <label class="field"><input id="workout-date" class="input field-input" type="date" required><span class="field-label" data-i18n="workout.date"></span></label>
          </div>
          <ul id="workout-entries" class="item-list"></ul>
          <div class="cluster">
            <button id="workout-add" class="button tonal" type="button" data-i18n="workout.addExercise"></button>
          </div>
          <label class="field"><textarea id="workout-comment" class="input field-input" maxlength="500" rows="2" data-i18n-attr="placeholder:workout.comment"></textarea><span class="field-label" data-i18n="workout.comment"></span></label>
          <div class="split">
            <button id="workout-finish" class="button primary hand-side" type="button" data-i18n="workout.finish"></button>
            <button id="workout-delete" class="button outline danger" type="button" data-i18n="workout.delete"></button>
          </div>
        </div>
      </section>

      <section id="routines" class="pane" hidden>
        <div class="pane-list">
          <ul id="routine-list" class="item-list"></ul>
          <div id="routines-empty" class="empty-state" hidden>
            <p data-i18n="routines.empty"></p>
            <button id="routines-add" class="button primary" type="button" data-i18n="routines.add"></button>
          </div>
        </div>
        <article id="routine-detail" class="pane-detail">
          <button id="routine-back" class="button quiet pane-back" type="button" data-i18n="common.back"></button>
          <p id="routine-pick" class="empty-state inline" data-i18n="routines.pick"></p>
          <div id="routine-body"></div>
        </article>
      </section>

      <section id="exercises" class="pane" hidden>
        <div class="pane-list">
          <ul id="exercise-list" class="item-list"></ul>
          <div id="exercises-empty" class="empty-state" hidden>
            <p data-i18n="exercises.empty"></p>
            <button id="exercises-add" class="button primary" type="button" data-i18n="exercises.add"></button>
            <button id="exercises-seed" class="button tonal" type="button" data-i18n="exercises.seed"></button>
          </div>
        </div>
        <article id="exercise-detail" class="pane-detail">
          <button id="exercise-back" class="button quiet pane-back" type="button" data-i18n="common.back"></button>
          <p id="exercise-pick" class="empty-state inline" data-i18n="exercises.pick"></p>
          <div id="exercise-body"></div>
        </article>
      </section>

      <section id="settings" class="settings" hidden>
        <div id="account-group" hidden>
          <h2 class="list-group-head" data-i18n="settings.account"></h2>
          <div class="list-group">
            <div id="account-row" class="settings-row"><span id="account-email" class="settings-row-label"></span><span id="account-sync" class="settings-row-value"></span></div>
            <button id="logout" class="settings-row" type="button"><span class="settings-row-label" data-i18n="account.logout"></span><span class="chevron" aria-hidden="true">›</span></button>
            <button id="account-login" class="settings-row" type="button"><span class="settings-row-label" data-i18n="account.signIn"></span><span class="chevron" aria-hidden="true">›</span></button>
          </div>
        </div>
        <h2 class="list-group-head" data-i18n="settings.training"></h2>
        <div class="list-group">
          <div class="settings-row">
            <span class="settings-row-label" data-i18n="settings.unit"></span>
            <span id="unit-value" class="settings-row-value"></span>
            <span class="chevron" aria-hidden="true">›</span>
            <select id="unit" class="select" data-i18n-attr="aria-label:settings.unit"></select>
          </div>
          <div class="settings-row">
            <span class="settings-row-label" data-i18n="settings.rest"></span>
            <span id="rest-value" class="settings-row-value"></span>
            <span class="chevron" aria-hidden="true">›</span>
            <select id="rest" class="select" data-i18n-attr="aria-label:settings.rest"></select>
          </div>
        </div>
        <h2 class="list-group-head" data-i18n="settings.backup"></h2>
        <div class="list-group">
          <button id="export" class="settings-row" type="button"><span class="settings-row-label" data-i18n="settings.export"></span><span class="chevron" aria-hidden="true">›</span></button>
          <button id="export-csv" class="settings-row" type="button"><span class="settings-row-label" data-i18n="settings.exportCsv"></span><span class="chevron" aria-hidden="true">›</span></button>
          <button id="import" class="settings-row" type="button"><span class="settings-row-label" data-i18n="settings.import"></span><span class="chevron" aria-hidden="true">›</span></button>
          <button id="reset" class="settings-row danger" type="button"><span class="settings-row-label" data-i18n="settings.reset"></span></button>
        </div>
        <h2 class="list-group-head" data-i18n="settings.preferences"></h2>
        <div class="list-group">
          <div class="settings-row">
            <span class="settings-row-label" data-i18n="settings.language"></span>
            <span id="language-value" class="settings-row-value"></span>
            <span class="chevron" aria-hidden="true">›</span>
            <select id="language" class="select" data-i18n-attr="aria-label:settings.language"></select>
          </div>
          <div class="settings-row">
            <span class="settings-row-label" data-i18n="settings.hand"></span>
            <span id="hand-value" class="settings-row-value"></span>
            <span class="chevron" aria-hidden="true">›</span>
            <select id="hand" class="select" data-i18n-attr="aria-label:settings.hand"></select>
          </div>
          <div class="settings-row">
            <span class="settings-row-label" data-i18n="settings.theme"></span>
            <span id="theme-value" class="settings-row-value"></span>
            <span class="chevron" aria-hidden="true">›</span>
            <select id="theme" class="select" data-i18n-attr="aria-label:settings.theme"></select>
          </div>
        </div>
        <h2 class="list-group-head" data-i18n="settings.modules"></h2>
        <div class="list-group">
          <label class="switch"><span data-i18n="nav.routines"></span><input class="switch-input" type="checkbox" role="switch" data-module="routines"></label>
        </div>
        <div id="install-group" hidden>
          <h2 class="list-group-head" data-i18n="settings.app"></h2>
          <div class="list-group">
            <button id="install" class="settings-row" type="button"><span class="settings-row-label" data-i18n="settings.install"></span><span class="chevron" aria-hidden="true">›</span></button>
          </div>
        </div>
        <h2 class="list-group-head" data-i18n="settings.help"></h2>
        <div class="list-group">
          <button id="show-onboarding" class="settings-row" type="button"><span class="settings-row-label" data-i18n="settings.onboarding"></span><span class="chevron" aria-hidden="true">›</span></button>
          <button id="show-whatsnew" class="settings-row" type="button" hidden><span class="settings-row-label" data-i18n="settings.whatsNew"></span><span class="chevron" aria-hidden="true">›</span></button>
        </div>
        <footer class="about">
          <p class="about-line"><span id="version"></span><span id="version-status" class="version-status" role="status" data-status="checking"><svg data-for="checking" class="icon small" aria-hidden="true"><use href="icons.svg#refresh"/></svg><svg data-for="current" class="icon small" aria-hidden="true"><use href="icons.svg#check-circle"/></svg><svg data-for="outdated" class="icon small" aria-hidden="true"><use href="icons.svg#download"/></svg><svg data-for="unknown" class="icon small" aria-hidden="true"><use href="icons.svg#offline"/></svg><span id="version-status-text" class="version-status-text"></span></span></p>
          <button id="update" class="button accent" type="button" hidden><span data-i18n="settings.update"></span></button>
        </footer>
      </section>
    </main>

    <button id="fab" class="fab" type="button" data-i18n-attr="aria-label:common.add">+</button>

    <nav class="nav-bar" data-i18n-attr="aria-label:nav.label">
      <button class="nav-item" type="button" data-view="workout">
        <svg class="icon" aria-hidden="true"><use href="icons.svg#dumbbell"/></svg>
        <span data-i18n="nav.workout"></span>
      </button>
      <button class="nav-item" type="button" data-view="routines">
        <svg class="icon" aria-hidden="true"><use href="icons.svg#list"/></svg>
        <span data-i18n="nav.routines"></span>
      </button>
      <button class="nav-item" type="button" data-view="exercises">
        <svg class="icon" aria-hidden="true"><use href="icons.svg#book"/></svg>
        <span data-i18n="nav.exercises"></span>
      </button>
      <button class="nav-item" type="button" data-view="settings">
        <svg class="icon" aria-hidden="true"><use href="icons.svg#settings"/></svg>
        <span data-i18n="nav.settings"></span>
      </button>
    </nav>

    <div id="whatsnew-sheet" class="sheet-layer" hidden>
      <div id="whatsnew-veil" class="sheet-veil"></div>
      <section id="whatsnew" class="sheet" role="dialog" aria-modal="true" aria-labelledby="whatsnew-title">
        <div class="sheet-grab"></div>
        <header class="sheet-head"><h2 id="whatsnew-title" class="sheet-title main" data-i18n="whatsNew.title"></h2><button id="whatsnew-close" class="button tonal" type="button" data-i18n="whatsNew.close"></button></header>
        <div id="whatsnew-body" class="sheet-body whatsnew-body"></div>
      </section>
    </div>

    <div id="edit-sheet" class="sheet-layer" hidden>
      <div id="edit-veil" class="sheet-veil"></div>
      <form id="edit-form" class="sheet" role="dialog" aria-modal="true" aria-labelledby="edit-title" autocomplete="off" novalidate>
        <div class="sheet-grab"></div>
        <header class="sheet-head"><h2 id="edit-title" class="sheet-title main"></h2><button id="edit-close" class="button tonal" type="button" data-i18n="common.close"></button></header>
        <div id="edit-body" class="sheet-body"></div>
        <footer id="edit-foot" class="sheet-foot"><button id="edit-submit" class="button primary wide" type="submit" data-i18n="common.save"></button></footer>
      </form>
    </div>

    <div id="onboarding" class="onboarding" role="dialog" aria-modal="true" data-i18n-attr="aria-label:onboarding.label" hidden>
      <img class="onboarding-logo" src="./icons/logo.png" alt="">
      <div id="onboarding-page" class="onboarding-page">
        <div class="onboarding-art">
          <svg data-page="welcome" viewBox="0 0 240 160" aria-hidden="true">
            <rect class="art-card" x="70" y="16" width="100" height="128" rx="12"/>
            <path class="art-accent" d="M90 50h60M90 74h44M90 98h52"/>
            <circle class="art-solid" cx="170" cy="130" r="18"/>
            <path class="art-on-solid" d="M170 122v16M162 130h16"/>
          </svg>
          <svg data-page="offline" viewBox="0 0 240 160" aria-hidden="true">
            <rect class="art-card" x="70" y="16" width="100" height="128" rx="12"/>
            <path class="art-accent" d="M96 70a34 34 0 0 1 48 0M106 82a20 20 0 0 1 28 0"/>
            <circle class="art-accent" cx="120" cy="96" r="4"/>
            <path d="M92 52l56 64"/>
          </svg>
        </div>
        <div aria-live="polite">
          <h2 id="onboarding-title" class="onboarding-title"></h2>
          <p id="onboarding-text" class="onboarding-text"></p>
        </div>
      </div>
      <div id="onboarding-dots" class="onboarding-dots" role="img"></div>
      <div class="onboarding-actions">
        <button id="onboarding-skip" class="button outline quiet" type="button" data-i18n="onboarding.skip"></button>
        <button id="onboarding-next" class="button primary" type="button"></button>
      </div>
    </div>

    <section id="auth" class="account" role="dialog" aria-modal="true" aria-labelledby="login-title" hidden>
      <div id="login" class="account-page">
        <img class="account-logo" src="./icons/logo.png" alt="">
        <h2 id="login-title" class="account-title" tabindex="-1" data-i18n="account.login.title"></h2>
        <p class="account-text" data-i18n="account.login.text"></p>
        <button id="login-google" class="button tonal wide" type="button"><svg class="icon small" aria-hidden="true"><use href="icons.svg#google"/></svg><span data-i18n="account.google"></span></button>
        <p id="login-error" class="input-help danger" role="alert" hidden></p>
        <button id="login-offline" class="button accent" type="button" data-i18n="account.offline"></button>
      </div>
      <div id="waiting" class="account-page" hidden>
        <svg class="icon account-wait" aria-hidden="true"><use href="icons.svg#refresh"/></svg>
        <h2 id="waiting-title" class="account-title" tabindex="-1" data-i18n="account.waiting.title"></h2>
        <p class="account-text" data-i18n="account.waiting.text"></p>
        <button id="waiting-check" class="button tonal wide" type="button" data-i18n="account.waiting.check"></button>
        <button id="waiting-logout" class="button accent" type="button" data-i18n="account.logout"></button>
      </div>
    </section>

    <input id="import-file" type="file" accept="application/json,.json" hidden>

    <script type="importmap">
      {
        "imports": {
          "#app": "./src/app.js",
          "#ds/sheet": "./vendor/design-system/sheet.js",
          "#config": "./src/config.js",
          "#ui/format": "./src/ui/format.js",
          "#csv": "./src/csv.js",
          "#timer": "./src/timer.js",
          "#bests": "./src/bests.js",
          "#plates": "./src/plates.js",
          "#body": "./src/body.js",
          "#insights": "./src/insights.js",
          "#goals": "./src/goals.js",
          "#units": "./src/units.js",
          "#workouts": "./src/workouts.js",
          "#progression": "./src/progression.js",
          "#routines": "./src/routines.js",
          "#exercises": "./src/exercises.js",
          "#training": "./src/training.js",
          "#pocketbase": "./src/pocketbase.js",
          "#session": "./src/session.js",
          "#records": "./src/records.js",
          "#sync": "./src/sync.js",
          "#syncer": "./src/syncer.js",
          "#install": "./src/install.js",
          "#sections": "./src/sections.js",
          "#modules": "./src/modules.js",
          "#storage": "./src/storage.js",
          "#version": "./src/version.js",
          "#whatsnew": "./src/whatsnew.js",
          "#i18n": "./src/i18n.js",
          "#locales/en": "./src/locales/en.js",
          "#locales/es": "./src/locales/es.js",
          "#ui/context": "./src/ui/context.js",
          "#ui/controls": "./src/ui/controls.js",
          "#ui/install": "./src/ui/install.js",
          "#ui/nav": "./src/ui/nav.js",
          "#ui/sheet": "./src/ui/sheet.js",
          "#ui/workout": "./src/ui/workout.js",
          "#ui/timer": "./src/ui/timer.js",
          "#ui/routines": "./src/ui/routines.js",
          "#ui/exercises": "./src/ui/exercises.js",
          "#ui/settings": "./src/ui/settings.js",
          "#particles": "./src/particles.js",
          "#onboarding": "./src/onboarding.js",
          "#ui/dust": "./src/ui/dust.js",
          "#ui/onboarding": "./src/ui/onboarding.js",
          "#ui/whatsnew": "./src/ui/whatsnew.js",
          "#ui/update": "./src/ui/update.js",
          "#ui/account": "./src/ui/account.js"
        }
      }
    </script>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
